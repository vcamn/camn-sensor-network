[project]
name = "camn-edge-collector"
version = "0.1.0"
description = " Python edge collector software that runs on CAMN Raspberry Pi sensor nodes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
